name: Setup Goose Environment
description: >
  Validates the framework version, installs Node.js, AI tools (Goose, Claude Code
  CLI, gh-agentic extension), conditionally installs project-specific language
  toolchains (Go, Java) based on repo manifests, configures agent authentication,
  and writes the Goose config file. Encapsulates every setup step the Goose-running
  pipeline jobs need so the workflow stays thin and the logic stays in one
  authoritative place.

  Conditional toolchain install: Go is installed when `go.mod` is present in the
  repo root; Java is installed when `pom.xml` or `build.gradle[.kts]` is present.
  Node.js is installed unconditionally because the Claude CLI itself is an npm
  package. The agent uses these toolchains to verify its work as it writes —
  without them the dev-session writes code blind, which is the root cause of
  features that fail their PR-time CI gate.

  Auth note: pipeline-pat is used for both the gh-agentic extension install (reads
  the release) and for Claude credential rotation (requires secrets:write). The same
  token that drives pipeline label operations is therefore sufficient here.

inputs:
  agentic-framework-version:
    description: >
      Value of vars.AGENTIC_FRAMEWORK_VERSION. Required — the job fails immediately
      if this is unset so the error surfaces at the top of the log rather than mid-run.
    required: true
  goose-version:
    description: 'Goose version to install (default: latest)'
    required: false
    default: 'latest'
  agent-provider:
    description: >
      Agent provider matching vars.AGENT_PROVIDER (e.g. claude-code, mistral).
      Drives which credential is configured and which Claude CLI cache key is used.
    required: false
    default: 'claude-code'
  agent-model:
    description: >
      Model written to GOOSE_MODEL in the Goose config file. Overridden at runtime
      by the GOOSE_MODEL env var on the recipe run step.
    required: false
    default: 'default'
  pipeline-pat:
    description: >
      PIPELINE_PAT secret. Used for the gh-agentic extension install and Claude
      credential rotation (secrets:write). Must not be github.token — see
      docs/pipeline-auth.md for the full rationale.
    required: true
  claude-credentials-json:
    description: >
      Base64-encoded Claude Code credentials (CLAUDE_CREDENTIALS_JSON secret).
      Required when agent-provider is claude-code; silently unused otherwise.
    required: false
    default: ''
  mistral-api-key:
    description: >
      Mistral API key (MISTRAL_API_KEY secret). Required when agent-provider is
      mistral; silently unused otherwise.
    required: false
    default: ''
  project-pat:
    description: >
      PROJECT_PAT secret — a CLASSIC PAT carrying read:packages. Used to
      authenticate Maven to the GitHub Packages registry (maven.pkg.github.com)
      for Java projects that pull private artifacts (e.g. the io.openbss:* parent
      POM). The fine-grained PIPELINE_PAT cannot authenticate to the legacy
      Maven/npm Packages API, so a classic token is required here. Silently
      unused for non-Java projects.
    required: false
    default: ''
  maven-packages-server-id:
    description: >
      The <server> id written into ~/.m2/settings.xml, which MUST match the
      <repository> id the project POM declares for GitHub Packages. Defaults to
      the repo owner login lowercased (the OpenBSS convention, e.g. "openbss").
      Override only if a POM uses a non-conventional repository id.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Fail early if the framework version is unset — a clear error here is better
    # than a cryptic failure mid-install when the extension version can't be resolved.
    - name: Validate framework version
      id: version
      shell: bash
      env:
        AGENTIC_FRAMEWORK_VERSION: ${{ inputs.agentic-framework-version }}
      run: |
        if [ -z "${AGENTIC_FRAMEWORK_VERSION}" ]; then
          echo "::error::AGENTIC_FRAMEWORK_VERSION is not set. Set the repo variable to pin the framework version."
          exit 1
        fi
        VERSION=$(echo "${AGENTIC_FRAMEWORK_VERSION}" | tr -d '[:space:]')
        echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

    # Node.js is required by the Claude Code CLI npm install inside install-ai-tools.
    # Placed here (in the non-submodule action) so it is always at the current
    # workflow version, not the pinned .agents/ submodule version.
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
      with:
        node-version: 'lts/*'

    # install-ai-tools handles: system packages, Goose binary, Claude Code CLI,
    # and the gh-agentic extension. Loaded from .agents/ (pinned to
    # agentic-framework-version) so it tracks the declared framework release.
    - name: Install tools
      uses: ./.agents/.github/actions/install-ai-tools
      with:
        agentic-version: ${{ steps.version.outputs.value }}
        goose-version: ${{ inputs.goose-version }}
        agent-provider: ${{ inputs.agent-provider }}
        gh-token: ${{ inputs.pipeline-pat }}

    # setup-agent-auth decodes credentials, validates the session, and handles
    # Claude token rotation if the session refreshed during validation.
    - name: Setup Agent Auth
      uses: ./.agents/.github/actions/setup-agent-auth
      with:
        agent-provider: ${{ inputs.agent-provider }}
        claude-credentials-json: ${{ inputs.claude-credentials-json }}
        mistral-api-key: ${{ inputs.mistral-api-key }}
        gh-token: ${{ inputs.pipeline-pat }}

    # Detect which language toolchains the *project* needs based on
    # repo-root manifests. The agent uses these to verify its work as it
    # writes — without them the dev-session writes code blind, which is
    # the root cause of "code that fails the PR-time build" symptoms.
    # Detection runs after checkout (which has already happened in the
    # caller's job) and BEFORE the Goose recipe runs.
    #
    # Node.js is installed unconditionally above because the Claude CLI
    # itself is an npm package; the agent needs it regardless of whether
    # the project uses TypeScript.
    #
    # Adding a new language is a four-step add:
    #   1. Add `standards/<lang>.md` with a `## Verification Gate` section
    #   2. Add a `<lang>=true/false` line to "Detect project languages"
    #   3. Add a `Setup <lang>` step gated on the corresponding output
    #   4. (Optional) Add any apt deps to `install-ai-tools`
    - name: Detect project languages
      id: stacks
      shell: bash
      run: |
        # go.mod at repo root → this is a Go module → install Go.
        if [ -f go.mod ]; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "go=false" >> "$GITHUB_OUTPUT"
        fi
        # Maven or Gradle build file → this is a Java project → install JDK.
        if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
          echo "java=true" >> "$GITHUB_OUTPUT"
        else
          echo "java=false" >> "$GITHUB_OUTPUT"
        fi

    # Install Go only when the repo is actually a Go module. Pins to the
    # Go version stated in go.mod so the agent verifies against the same
    # toolchain the project targets. cache=false because dev-session
    # runs are ephemeral; the cache hit rate would be low and not worth
    # the network round-trip.
    - name: Setup Go
      if: steps.stacks.outputs.go == 'true'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
      with:
        go-version-file: go.mod
        cache: false

    # Install JDK only when the repo is actually a Java project. java-version
    # is 21 (current LTS) as a pragmatic default; per-project version pinning
    # can be added later via `java-version-file` (.java-version, etc.) if a
    # project needs it.
    - name: Setup Java
      if: steps.stacks.outputs.java == 'true'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
      with:
        distribution: temurin
        java-version: '21'

    # setup-java installs the JDK but not Maven itself. GitHub-hosted images ship
    # Maven, but self-hosted runners generally do not — so the agent's mandatory
    # `mvn clean verify` gate is unrunnable and every Java task blocks. Install a
    # pinned Apache Maven into $HOME (no sudo/apt needed, works on any Linux
    # runner) when it is absent, and add it to PATH for the recipe step.
    - name: Install Maven (if absent)
      if: steps.stacks.outputs.java == 'true'
      shell: bash
      run: |
        if command -v mvn >/dev/null 2>&1; then
          echo "✓ Maven already present: $(mvn -v | head -1)"
          exit 0
        fi
        MAVEN_VERSION=3.9.9
        echo "Maven not found — installing Apache Maven ${MAVEN_VERSION} to \$HOME/.local."
        curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o /tmp/apache-maven.tar.gz
        mkdir -p "$HOME/.local/apache-maven"
        tar -xzf /tmp/apache-maven.tar.gz -C "$HOME/.local/apache-maven" --strip-components=1
        rm -f /tmp/apache-maven.tar.gz
        echo "$HOME/.local/apache-maven/bin" >> "$GITHUB_PATH"
        "$HOME/.local/apache-maven/bin/mvn" -v | head -1
        echo "✓ Maven ${MAVEN_VERSION} installed."

    # Java projects in this federation pull private artifacts (e.g. the
    # io.openbss:* parent POM) from GitHub Packages. Maven never reads GH_TOKEN,
    # and the fine-grained PIPELINE_PAT cannot authenticate to the legacy Maven
    # Packages registry anyway — a CLASSIC token with read:packages is required.
    # PROJECT_PAT is that token. Wire it in via ~/.m2/settings.xml so `mvn` can
    # resolve private artifacts; without this the parent POM 401s and nothing
    # compiles. The <server> id must match the POM's <repository> id (OpenBSS
    # convention: owner login lowercased). The token is referenced as
    # ${env.MAVEN_PACKAGES_TOKEN} — resolved by Maven at build time from the job
    # env (exported below, masked) — so it is never written to disk in plaintext.
    - name: Configure Maven for GitHub Packages
      if: steps.stacks.outputs.java == 'true'
      shell: bash
      env:
        PACKAGES_TOKEN: ${{ inputs.project-pat }}
        OWNER: ${{ github.repository_owner }}
        SERVER_ID_OVERRIDE: ${{ inputs.maven-packages-server-id }}
      run: |
        if [ -z "${PACKAGES_TOKEN}" ]; then
          echo "::warning::PROJECT_PAT was not provided to setup-goose-env — Maven cannot authenticate to GitHub Packages. Private artifacts (e.g. io.openbss:* parent POM) will 401. Pass project-pat: \${{ secrets.PROJECT_PAT }} at the call site."
        fi
        SERVER_ID="${SERVER_ID_OVERRIDE:-$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')}"
        mkdir -p "$HOME/.m2"
        # Unquoted heredoc: ${SERVER_ID}/${OWNER} are expanded by the shell now;
        # \${env.MAVEN_PACKAGES_TOKEN} is written literally for Maven to resolve.
        cat > "$HOME/.m2/settings.xml" <<SETTINGSEOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>${SERVER_ID}</id>
              <username>${OWNER}</username>
              <password>\${env.MAVEN_PACKAGES_TOKEN}</password>
            </server>
          </servers>
        </settings>
        SETTINGSEOF
        # Export the token to the job env (masked) so the recipe step's `mvn`
        # resolves ${env.MAVEN_PACKAGES_TOKEN}. No token is written to settings.xml.
        echo "::add-mask::${PACKAGES_TOKEN}"
        echo "MAVEN_PACKAGES_TOKEN=${PACKAGES_TOKEN}" >> "$GITHUB_ENV"
        echo "✓ Wrote ~/.m2/settings.xml for GitHub Packages server id '${SERVER_ID}'."

    # Write provider/model to the Goose config file so they are the defaults even
    # if the env vars are not inherited by a subprocess. The recipe run step also
    # sets GOOSE_PROVIDER and GOOSE_MODEL as env vars, which take precedence.
    - name: Configure Goose
      shell: bash
      run: |
        mkdir -p ~/.config/goose
        cat > ~/.config/goose/config.yaml <<GOOSEEOF
        GOOSE_PROVIDER: ${{ inputs.agent-provider }}
        GOOSE_MODEL: ${{ inputs.agent-model }}
        GOOSEEOF
